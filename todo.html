<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List | Samarjeet Singh</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1b4d;--bg2:#10286b;--card:#12296e;--line:#2f50b8;--text:#fff;--muted:#c3d3ff;--gold:#ffd23f;--coral:#ff7a1a;--mint:#19d3ff;--lime:#7dff4f;--ink:#0a1b4d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:rgba(10,27,77,.9)}
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px 12px 12px 3px;background:var(--gold);color:var(--ink);font-weight:700;transition:transform .2s,box-shadow .2s}
.back:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--coral)}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem}
main{flex:1;padding:36px 20px 48px}
.wrap{width:min(560px,100%);margin:0 auto}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(2rem,6vw,3rem);font-weight:800;text-align:center;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:26px;text-align:center}
.todo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:10px 10px 0 var(--lime);animation:pop .5s cubic-bezier(.2,1.2,.3,1)}
form{display:flex;gap:10px}
input.add{flex:1;min-width:0;padding:14px 16px;background:var(--bg2);border:2px solid var(--line);border-radius:8px;color:var(--text);font:inherit}
input.add:focus{outline:none;border-color:var(--gold)}
.btn{padding:0 22px;border:0;border-radius:10px 10px 10px 3px;background:var(--gold);color:var(--ink);font:700 1rem "DM Sans",sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--coral)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{margin:20px 0 14px}
.progress .row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.pbar{height:10px;border-radius:5px;background:var(--bg2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--lime);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.filters{display:flex;gap:8px;margin-bottom:14px}
.f{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:700 .9rem "DM Sans",sans-serif;cursor:pointer;transition:.2s}
.f:hover{color:var(--text);border-color:var(--mint)}
.f[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--ink)}
ul{list-style:none;display:grid;gap:10px;min-height:60px}
.item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;transition:opacity .2s,transform .2s}
.item.new{animation:slide .35s ease-out}
.item.out{opacity:0;transform:translateX(40px)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mint);background:transparent;color:var(--ink);font-weight:800;cursor:pointer;transition:.2s}
.chk:hover{background:rgba(25,211,255,.2)}
.item.done .chk{background:var(--lime);border-color:var(--lime)}
.txt{flex:1;min-width:0;word-break:break-word;transition:color .2s}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.ic{flex:none;width:34px;height:34px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:var(--text);font-size:1.1rem;cursor:pointer;transition:.2s}
.ic:hover{background:var(--gold);color:var(--ink)}
.ic.del:hover{background:var(--coral)}
input.edit{flex:1;min-width:0;padding:8px 10px;background:var(--bg);border:2px solid var(--gold);border-radius:6px;color:var(--text);font:inherit}
input.edit:focus{outline:none}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:.9rem}
.clear{background:none;border:0;color:var(--coral);font:700 .9rem "DM Sans",sans-serif;cursor:pointer;border-bottom:2px solid var(--coral);padding:0}
.clear:disabled{opacity:.4;cursor:not-allowed}
footer{text-align:center;padding:20px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);background:rgba(10,27,77,.9)}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(30px)}}
@keyframes slide{from{opacity:0;transform:translateY(-14px)}}
.calm *{animation:none!important;transition:none!important}
@media(max-width:480px){header{padding:12px 16px}.todo{padding:16px}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <a class="back" href="index.html">&larr; Back to portfolio</a>
  <span class="brand">Samarjeet Singh</span>
</header>

<main><div class="wrap">
  <h1>To-Do List</h1>
  <p class="sub">Plan your day. Your tasks are saved in this browser.</p>
  <div class="todo">
    <form id="form">
      <input class="add" id="newTask" placeholder="Add a new task" maxlength="120" aria-label="New task" autocomplete="off">
      <button class="btn" id="addBtn" type="submit" disabled>Add</button>
    </form>
    <div class="progress">
      <div class="row"><span id="doneTxt">0 of 0 done</span><span id="pct">0%</span></div>
      <div class="pbar"><i id="pbar"></i></div>
    </div>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="f" type="button" data-f="all" aria-pressed="true">All</button>
      <button class="f" type="button" data-f="active" aria-pressed="false">Active</button>
      <button class="f" type="button" data-f="done" aria-pressed="false">Done</button>
    </div>
    <ul id="list"></ul>
    <div class="foot"><span id="left">0 tasks left</span><button class="clear" id="clear" type="button" disabled>Clear completed</button></div>
  </div>
</div></main>

<footer>&copy; <span id="year"></span> Samarjeet Singh</footer>

<script>
const $ = s => document.querySelector(s);
const KEY = "samarjeet-todo-v1";
let tasks = [], filter = "all", editing = null, lastAdded = null;
try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; if (!Array.isArray(tasks)) tasks = []; } catch (e) { tasks = []; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  const shown = tasks.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
  $("#list").innerHTML = shown.length ? shown.map(t => editing === t.id
    ? `<li class="item" data-id="${t.id}"><input class="edit" value="${esc(t.text)}" maxlength="120" aria-label="Edit task"><button class="ic" type="button" data-a="save" aria-label="Save task">&#10003;</button><button class="ic del" type="button" data-a="cancel" aria-label="Cancel editing">&times;</button></li>`
    : `<li class="item${t.done ? " done" : ""}${t.id === lastAdded ? " new" : ""}" data-id="${t.id}"><button class="chk" type="button" data-a="toggle" aria-pressed="${t.done}" aria-label="Mark as ${t.done ? "not done" : "done"}: ${esc(t.text)}">${t.done ? "&#10003;" : ""}</button><span class="txt">${esc(t.text)}</span><button class="ic" type="button" data-a="edit" aria-label="Edit task">&#9998;</button><button class="ic del" type="button" data-a="del" aria-label="Delete task">&times;</button></li>`).join("")
    : `<li class="empty">${tasks.length ? "Nothing here in this view." : "No tasks yet. Add your first task above."}</li>`;
  lastAdded = null;
  const total = tasks.length, done = tasks.filter(t => t.done).length, pct = total ? Math.round(done / total * 100) : 0, left = total - done;
  $("#doneTxt").textContent = `${done} of ${total} done`; $("#pct").textContent = pct + "%"; $("#pbar").style.width = pct + "%";
  $("#left").textContent = `${left} task${left === 1 ? "" : "s"} left`; $("#clear").disabled = done === 0;
  const inp = $("#list .edit"); if (inp) { inp.focus(); inp.select(); }
}

$("#newTask").addEventListener("input", e => { $("#addBtn").disabled = !e.target.value.trim(); });
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("#newTask").value.trim(); if (!text) return;
  const id = Date.now() + "-" + Math.random().toString(36).slice(2, 7);
  tasks.unshift({ id, text, done: false }); lastAdded = id;
  if (filter === "done") filter = "all", syncFilters();
  $("#newTask").value = ""; $("#addBtn").disabled = true; save(); render(); $("#newTask").focus();
});

function syncFilters() { document.querySelectorAll(".f").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter)); }
document.querySelectorAll(".f").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; editing = null; syncFilters(); render(); }));

function saveEdit(li) {
  const t = tasks.find(x => x.id === li.dataset.id), v = li.querySelector(".edit").value.trim();
  if (t && v) t.text = v; editing = null; save(); render();
}
$("#list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const li = b.closest(".item"), id = li.dataset.id, a = b.dataset.a, t = tasks.find(x => x.id === id);
  if (a === "toggle") { t.done = !t.done; save(); render(); }
  else if (a === "edit") { editing = id; render(); }
  else if (a === "save") saveEdit(li);
  else if (a === "cancel") { editing = null; render(); }
  else if (a === "del") { li.classList.add("out"); setTimeout(() => { tasks = tasks.filter(x => x.id !== id); save(); render(); }, 200); }
});
$("#list").addEventListener("keydown", e => {
  if (!e.target.classList.contains("edit")) return;
  if (e.key === "Enter") saveEdit(e.target.closest(".item"));
  else if (e.key === "Escape") { editing = null; render(); }
});
$("#clear").addEventListener("click", () => { tasks = tasks.filter(t => !t.done); save(); render(); });
render();
$("#year").textContent = new Date().getFullYear();

// ===== Background: twinkling stars, floating symbols, shooting stars =====
let calm = false; try { calm = localStorage.getItem("calm") === "1"; } catch (e) {}
if (calm) document.documentElement.classList.add("calm");
const cv = $("#bg"), cx = cv.getContext("2d"), rnd = n => Math.random() * n;
const COLORS = ["#ffd23f", "#19d3ff", "#ff7a1a", "#7dff4f"], GLYPHS = ["✓", "[ ]", "</>", "{ }", "•", "JS", "01", "☐"];
let W, H, S = [], G = [], SH = [];
const glyph = init => ({ x: rnd(W), y: init ? rnd(H) : H + 30, vy: -(.2 + rnd(.4)), rot: rnd(6.28), vr: rnd(.012) - .006, size: 18 + rnd(26), c: COLORS[rnd(4) | 0], t: GLYPHS[rnd(GLYPHS.length) | 0], a: .14 + rnd(.2) });
function size() {
  const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
  S = Array.from({ length: Math.min(130, W * H / 9000 | 0) }, () => ({ x: rnd(W), y: rnd(H), r: .4 + rnd(1.2), t: rnd(6.28), sp: .01 + rnd(.03) }));
  G = Array.from({ length: Math.min(18, W * H / 55000 + 6 | 0) }, () => glyph(true));
}
function draw() {
  cx.clearRect(0, 0, W, H); cx.fillStyle = "#fff";
  for (const s of S) { s.t += s.sp; cx.globalAlpha = .4 + .6 * Math.abs(Math.sin(s.t)); cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill(); }
  cx.textAlign = "center"; cx.textBaseline = "middle";
  for (let i = 0; i < G.length; i++) {
    const g = G[i]; g.y += g.vy; g.rot += g.vr; if (g.y < -40) G[i] = glyph(false);
    cx.save(); cx.translate(g.x, g.y); cx.rotate(g.rot); cx.globalAlpha = g.a; cx.fillStyle = g.c;
    cx.font = `700 ${g.size}px "Bricolage Grotesque", monospace`; cx.fillText(g.t, 0, 0); cx.restore();
  }
  if (!calm && Math.random() < .008 && SH.length < 2) SH.push({ x: W * .2 + rnd(W * .8), y: rnd(H * .4), vx: -(9 + rnd(5)), vy: 5 + rnd(3) });
  for (let i = SH.length - 1; i >= 0; i--) {
    const s = SH[i]; s.x += s.vx; s.y += s.vy;
    const tx = s.x - s.vx * 7, ty = s.y - s.vy * 7, g = cx.createLinearGradient(s.x, s.y, tx, ty);
    g.addColorStop(0, "rgba(255,255,255,.95)"); g.addColorStop(1, "rgba(255,255,255,0)");
    cx.globalAlpha = 1; cx.strokeStyle = g; cx.lineWidth = 2.2; cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(tx, ty); cx.stroke();
    if (s.x < -100 || s.y > H + 100) SH.splice(i, 1);
  }
  cx.globalAlpha = 1;
  if (!calm) requestAnimationFrame(draw);
}
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { size(); if (calm) draw(); }, 200); });
size(); draw();
</script>
</body>
</html>
